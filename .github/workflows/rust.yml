name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla/actions/rust@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0
        with:
          components: llvm-tools
          tools: cargo-llvm-cov
          token: ${{ github.token }}
      - name: Run tests and determine coverage
        run: cargo llvm-cov test --codecov --output-path codecov.json
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          verbose: true
          flags: linux
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]

  rustfmt:
    uses: mozilla/actions/.github/workflows/rustfmt.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0

  clippy:
    uses: mozilla/actions/.github/workflows/clippy.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0

  deny:
    uses: mozilla/actions/.github/workflows/deny.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0

  machete:
    uses: mozilla/actions/.github/workflows/machete.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0

  semver:
    name: Check semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: mozilla/actions/semver@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0

  mutants-pr:
    if: github.event_name == 'pull_request'
    uses: mozilla/actions/.github/workflows/mutants-pr.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: mozilla/actions/.github/workflows/dependency-review.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0

  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to GitHub
