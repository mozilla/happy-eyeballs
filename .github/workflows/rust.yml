name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla/actions/rust@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8
        with:
          components: llvm-tools
          tools: cargo-llvm-cov
          token: ${{ github.token }}
      - name: Run tests and determine coverage
        run: cargo llvm-cov test --codecov --output-path codecov.json
      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          verbose: true
          flags: linux
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]

  rustfmt:
    uses: mozilla/actions/.github/workflows/rustfmt.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8

  clippy:
    uses: mozilla/actions/.github/workflows/clippy.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8

  deny:
    uses: mozilla/actions/.github/workflows/deny.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8

  machete:
    uses: mozilla/actions/.github/workflows/machete.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8

  semver:
    name: Check semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: mozilla/actions/semver@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8

  mutants-pr:
    if: github.event_name == 'pull_request'
    uses: mozilla/actions/.github/workflows/mutants-pr.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: mozilla/actions/.github/workflows/dependency-review.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8

  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to GitHub
