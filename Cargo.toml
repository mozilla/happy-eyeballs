[package]
name = "happy-eyeballs"
version = "1.0.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = { version = "2.0.12", default-features = false }
tracing = { version = "0.1.37", default-features = false, features = ["std"] }
